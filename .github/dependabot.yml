version: 2

# Version-update PRs are paused (open-pull-requests-limit: 0) until 2026-10-23; raise the limit to resume.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        update-types:
          - "major"
    commit-message:
      prefix: "chore(deps)"
